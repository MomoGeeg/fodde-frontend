# Vérifications automatiques du frontend, à chaque PR et à chaque fusion sur la branche
# principale : lint (erreurs bloquantes, avertissements tolérés) et construction.
name: Vérifications

on:
  pull_request:
  push:
    branches: [fodde-frontend]

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
